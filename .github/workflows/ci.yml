name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (quartz image)
    runs-on: [self-hosted, aiengg, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build from the repo root so the Dockerfile can COPY aiengg/, quartz/,
          # package.json, etc. The Dockerfile itself lives at docker/Dockerfile.
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/mandalorianbatman/aiengg-docsify:${{ github.sha }}
            ghcr.io/mandalorianbatman/aiengg-docsify:latest
          # Cache layers in a separate `buildcache` image so the published
          # `latest` / sha tags stay clean. cache-from is a list so first
          # builds fall back to the prior image and never fail.
          cache-from: |
            type=registry,ref=ghcr.io/mandalorianbatman/aiengg-docsify:buildcache
            type=registry,ref=ghcr.io/mandalorianbatman/aiengg-docsify:latest
          cache-to: type=registry,ref=ghcr.io/mandalorianbatman/aiengg-docsify:buildcache,mode=max
