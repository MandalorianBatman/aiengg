server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Quartz emits /foo/bar.html but links /foo/bar. try_files tries:
    #   exact file → file.html → directory/index.html → 404
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # Cache static assets aggressively (Quartz hashes filenames in /static/)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any 404 falls back to /404.html so Quartz SPA can render
    # the in-app 404 page instead of showing the browser's default.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
