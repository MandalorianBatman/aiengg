name: deploy

# Deploy strictly after CI has built and published the image. Using
# `workflow_run` (instead of `push`) avoids a race where deploy tries to
# `docker pull` a tag CI hasn't finished publishing yet.
#
# For manual rebuilds: trigger the `ci` workflow via `workflow_dispatch`
# (it'll build + push, and this workflow will pick it up automatically).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (quartz)
    runs-on: [self-hosted, aiengg, linux, x64]
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Sync deploy dir with ref
        run: |
          DEPLOY_DIR=/home/zed/dev/ci-cd/aiengg
          DEPLOY_CI_HOME=$(mktemp -d)
          export GIT_CONFIG_GLOBAL="$DEPLOY_CI_HOME/gitconfig"
          git config --global "url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf" https://github.com/
          mkdir -p "$(dirname "$DEPLOY_DIR")"
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone "${{ github.server_url }}/${{ github.repository }}.git" "$DEPLOY_DIR"
          fi
          cd "$DEPLOY_DIR"
          # When triggered by workflow_run, check out the SHA that CI built.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_REF="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_REF="${{ github.ref }}"
          fi
          echo "Syncing deploy dir with $DEPLOY_REF"
          git fetch origin "$DEPLOY_REF"
          git reset --hard FETCH_HEAD
          rm -rf "$DEPLOY_CI_HOME"

      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi
          echo "image=ghcr.io/mandalorianbatman/aiengg-docsify:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Pull image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker pull "$IMAGE"

      - name: Run deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SKIP_GIT_SYNC: "true"
        run: /home/zed/dev/ci-cd/aiengg/scripts/deploy.sh

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
