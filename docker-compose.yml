services:
  quartz:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aiengg-quartz
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # No volume mount: the static site is baked into the image by the
    # multi-stage build. To preview local edits, run `npx quartz build --serve`
    # on the host instead.
