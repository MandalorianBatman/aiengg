services:
  docsify:
    build: .
    container_name: aiengg-docsify
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount the aiengg folder as the docsify document root.
      # The index.html, _sidebar.md, _coverpage.md are baked into the
      # folder itself so the layout is fully co-located with content.
      - /home/zed/aiengg-docsify/aiengg:/docs:ro
