server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 301 redirects for old URLs ─────────────────────────────────────────
    # Renumbering in commit e47ed8d renamed these files. Browsers,
    # bookmarks, and external links still hitting the old paths should
    # land on the new ones with a permanent redirect, not 404.
    location = /sessions/llm-basics-transformer-internals           { return 301 /sessions/1-llm-basics; }
    location = /sessions/llm-basics-transformer-internals.html      { return 301 /sessions/1-llm-basics; }
    location = /sessions/llm-basics-transformer-internals-graph      { return 301 /sessions/1-llm-basics-graph; }
    location = /sessions/llm-basics-transformer-internals-graph.html { return 301 /sessions/1-llm-basics-graph; }
    location = /sessions/llm-training-pipeline-tool-use             { return 301 /sessions/2-training-pipeline; }
    location = /sessions/llm-training-pipeline-tool-use.html        { return 301 /sessions/2-training-pipeline; }
    location = /sessions/llm-training-pipeline-tool-use-graph        { return 301 /sessions/2-training-pipeline-graph; }
    location = /sessions/llm-training-pipeline-tool-use-graph.html   { return 301 /sessions/2-training-pipeline-graph; }
    location = /sessions/doubts-networking-week-1                   { return 301 /sessions/3-week-1-doubts; }
    location = /sessions/doubts-networking-week-1.html              { return 301 /sessions/3-week-1-doubts; }
    location = /sessions/doubts-networking-week-1-graph              { return 301 /sessions/3-week-1-doubts-graph; }
    location = /sessions/doubts-networking-week-1-graph.html         { return 301 /sessions/3-week-1-doubts-graph; }

    # Quartz emits /foo/bar.html but links /foo/bar. try_files tries:
    #   exact file → file.html → directory/index.html → 404
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # Cache static assets aggressively (Quartz hashes filenames in /static/)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any 404 falls back to /404.html so Quartz SPA can render
    # the in-app 404 page instead of showing the browser's default.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
