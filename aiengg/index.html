<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Engineering Knowledge Base</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Knowledge graphs and summaries from the AI Engineering Cohort (InterviewReady / Gaurav Sen)">

  <!-- Docsify themes -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">

  <style>
    :root {
      --theme-color: #2196f3;
      --theme-color-secondary: #1976d2;
    }
    .app-name-link img { max-height: 40px; }
    /* Center mermaid diagrams and add some breathing room */
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
      overflow-x: auto;
    }
    #theme-toggle {
      position: fixed; top: 12px; right: 20px;
      background: none; border: 1px solid var(--theme-color, #2196f3);
      color: var(--theme-color, #2196f3);
      border-radius: 6px; padding: 4px 10px;
      cursor: pointer; font-size: 16px; z-index: 100;
      line-height: 1;
    }
    /* Dark theme */
    body.dark {
      --theme-color: #64b5f6;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    body.dark .sidebar {
      background: #16213e;
      border-right-color: #2a2a4a;
    }
    body.dark .sidebar-nav li > a,
    body.dark .sidebar-nav li.active > a {
      color: #b0b0cc;
    }
    body.dark .sidebar-nav li.active > a {
      color: #64b5f6;
      border-right-color: #64b5f6;
    }
    body.dark .markdown-section { color: #e0e0e0; }
    body.dark .markdown-section h1,
    body.dark .markdown-section h2,
    body.dark .markdown-section h3,
    body.dark .markdown-section h4 { color: #f0f0f0; }
    body.dark .markdown-section code {
      background: #2a2a4a;
      color: #e0b0ff;
    }
    body.dark .markdown-section pre {
      background: #0d1117;
    }
    body.dark blockquote {
      background: #16213e;
      border-left-color: #64b5f6;
      color: #ccc;
    }
    body.dark table th { background: #16213e; }
    body.dark table td { border-color: #2a2a4a; }
    body.dark .search input {
      background: #2a2a4a;
      color: #e0e0e0;
    }
    body.dark .search input::placeholder { color: #888; }
    body.dark .search .results-panel {
      background: #1a1a2e;
      color: #e0e0e0;
    }
    body.dark .pagination-item a,
    body.dark .pagination-item--next a,
    body.dark .pagination-item--previous a {
      color: #64b5f6;
      border-color: #2a2a4a;
    }
    body.dark .app-nav a { color: #b0b0cc; }
    body.dark .app-nav a:hover,
    body.dark .app-nav li.active > a { color: #64b5f6; }
    body.dark hr { border-color: #2a2a4a; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'AI Engineering Knowledge Base',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      maxLevel: 4,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results found.',
        depth: 6,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      // Mermaid plugin: registered as a docsify plugin so Mermaid runs
      // after each page is rendered into the DOM.
      plugins: [
        function mermaidPlugin(hook) {
          hook.doneEach(function () {
            if (typeof mermaid === 'undefined') return;

            // Match common class patterns that docsify/marked/Prism
            // might emit for a ` ```mermaid ` fenced code block.
            var blocks = document.querySelectorAll(
              'pre code.language-mermaid, pre code.lang-mermaid, pre code.mermaid'
            );
            blocks.forEach(function (block, idx) {
              var code = block.textContent;
              var pre = block.parentElement;
              var div = document.createElement('div');
              div.className = 'mermaid';
              // Mermaid reads the source from textContent.
              div.textContent = code;
              // Unique id avoids collisions across navigations.
              div.id = 'mermaid-' + idx + '-' + Date.now();
              pre.replaceWith(div);
            });

            if (blocks.length > 0) {
              mermaid.run({ querySelector: '.mermaid' });
            }
          });
        },
      ],
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Copy code -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>

  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>

  <!-- Tabs -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/tabs.min.js"></script>

  <!-- Zoom image -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Mermaid (rendered via the plugin registered above) -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        flowchart: { useMaxWidth: true, htmlLabels: true },
      });
    }
  </script>

  <!-- Dark theme toggle -->
  <script>
    (function() {
      var toggle = document.createElement('button');
      toggle.id = 'theme-toggle';
      toggle.title = 'Toggle dark mode';
      document.addEventListener('DOMContentLoaded', function() {
        document.body.appendChild(toggle);
      });

      var saved = localStorage.getItem('docsify-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
        toggle.textContent = '☀️';
      } else {
        toggle.textContent = '🌙';
      }

      toggle.onclick = function() {
        document.body.classList.toggle('dark');
        var isDark = document.body.classList.contains('dark');
        toggle.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('docsify-theme', isDark ? 'dark' : 'light');
      };
    })();
  </script>
</body>
</html>
